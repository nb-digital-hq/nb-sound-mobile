name: Feature request
description: Propose a change to what the app does
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Read the [product philosophy](../blob/main/docs/design/product-philosophy.md) first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
